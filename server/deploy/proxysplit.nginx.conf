server {
    listen 80;
    listen [::]:80;
    server_name proxysplit.zygskins.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name proxysplit.zygskins.cn;

    ssl_certificate /opt/ssl/zygskins.cn/fullchain.pem;
    ssl_certificate_key /opt/ssl/zygskins.cn/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_session_cache shared:SSL:10m;

    access_log /var/log/nginx/proxysplit.access.log;
    error_log /var/log/nginx/proxysplit.error.log;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    root /opt/proxysplit/current/apps/site;
    index index.html;
    client_max_body_size 4m;

    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        alias /opt/proxysplit/current/apps/admin/dist/;
        index index.html;
        # SPA fallback: client-side routes (/admin/users …) must serve index.html
        # on a hard refresh instead of 404ing.
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-store";
    }

    location ^~ /download/ {
        alias /opt/proxysplit/downloads/;
        types { application/octet-stream exe; }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff" always;

        # AI 编程官网免登录下载：文件名带 POWER云 一次性凭据（docs/中转站渠道.md），同一个安装包。
        # 凭据不进访问日志、不缓存；文件名显式写进 Content-Disposition（下载器按响应头命名也带着凭据）。
        location ~ "^/download/(?<ps_ticket_file>proxysplit-ai-[A-Za-z0-9_-]{43}\.exe)$" {
            root /opt/proxysplit;
            try_files /downloads/proxysplit-latest.exe =404;
            types { }
            default_type application/octet-stream;
            access_log off;
            add_header Content-Disposition 'attachment; filename="$ps_ticket_file"';
            add_header Cache-Control "no-store";
            add_header Referrer-Policy "no-referrer" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
        }
    }

    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /health {
        proxy_pass http://127.0.0.1:18780/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:18780;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
