services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: proxysplit
      POSTGRES_USER: proxysplit
      POSTGRES_PASSWORD: change-me
    ports: ["5432:5432"]
    volumes: ["proxysplit_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["proxysplit_redis:/data"]
volumes:
  proxysplit_pg:
  proxysplit_redis:
