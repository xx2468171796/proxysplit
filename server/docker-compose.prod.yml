name: proxysplit

# PostgreSQL / Redis 用深圳共享实例（2026-09-25 起，不再自带容器）：
# DATABASE_URL -> host.docker.internal:5432/proxysplit（专用账号 proxysplit）
# REDIS_URL    -> host.docker.internal:6379/9（ACL 用户 proxysplit，只能碰 proxysplit:* 与 fastify-rate-limit-*）

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    profiles: ["tools"]
    env_file: /opt/proxysplit/secrets/runtime.env
    volumes:
      - /opt/proxysplit/secrets/license-private.pem:/run/secrets/license-private.pem:ro
      - /opt/proxysplit/secrets/license-public.pem:/run/secrets/license-public.pem:ro
    command: ["pnpm", "--filter", "@proxysplit/db", "migrate"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    init: true
    env_file:
      - /opt/proxysplit/secrets/runtime.env
      - /opt/proxysplit/secrets/payment-zhongzhuan.env
    environment:
      HOST: 0.0.0.0
      PORT: 18780
      PUBLIC_BASE_URL: https://proxysplit.zygskins.cn
    volumes:
      - /opt/proxysplit/secrets/license-private.pem:/run/secrets/license-private.pem:ro
      - /opt/proxysplit/secrets/license-public.pem:/run/secrets/license-public.pem:ro
    ports:
      - "127.0.0.1:18780:18780"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18780/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [backend]

networks:
  backend:
    driver: bridge
