name: proxysplit

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:17-alpine
    restart: unless-stopped
    env_file: /opt/proxysplit/secrets/runtime.env
    environment:
      POSTGRES_DB: proxysplit
      POSTGRES_USER: proxysplit
    volumes:
      - proxysplit_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxysplit -d proxysplit"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: public.ecr.aws/docker/library/redis:7.4-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    env_file: /opt/proxysplit/secrets/runtime.env
    volumes:
      - proxysplit_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    profiles: ["tools"]
    env_file: /opt/proxysplit/secrets/runtime.env
    volumes:
      - /opt/proxysplit/secrets/license-private.pem:/run/secrets/license-private.pem:ro
      - /opt/proxysplit/secrets/license-public.pem:/run/secrets/license-public.pem:ro
    command: ["pnpm", "--filter", "@proxysplit/db", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    init: true
    env_file: /opt/proxysplit/secrets/runtime.env
    environment:
      HOST: 0.0.0.0
      PORT: 18780
    volumes:
      - /opt/proxysplit/secrets/license-private.pem:/run/secrets/license-private.pem:ro
      - /opt/proxysplit/secrets/license-public.pem:/run/secrets/license-public.pem:ro
    ports:
      - "127.0.0.1:18780:18780"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18780/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  proxysplit_pg:
  proxysplit_redis:
