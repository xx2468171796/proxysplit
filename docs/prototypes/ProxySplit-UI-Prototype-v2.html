<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProxySplit UI Prototype v2</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --panel-2: #f8fafc;
      --line: #e6ebf2;
      --line-strong: #d9e1ec;
      --text: #172033;
      --text-2: #536076;
      --muted: #8a97aa;
      --brand: #2864e8;
      --brand-2: #4d7ff0;
      --brand-soft: #edf3ff;
      --green: #18a566;
      --green-soft: #eaf9f1;
      --orange: #df8a19;
      --orange-soft: #fff6e8;
      --red: #e15361;
      --shadow: 0 10px 30px rgba(27, 43, 75, .07);
      --shadow-sm: 0 4px 14px rgba(27, 43, 75, .06);
      --radius: 15px;
      --sidebar: 218px;
      --topbar: 72px;
      --statusbar: 36px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-width: 1180px; min-height: 760px; background: var(--bg); color: var(--text); }
    body { font-family: Inter, "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; font-size: 14px; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .app-shell { min-height: 100vh; display: grid; grid-template-columns: var(--sidebar) 1fr; }
    .sidebar {
      position: fixed; inset: 0 auto 0 0; width: var(--sidebar); z-index: 20;
      background: var(--panel); border-right: 1px solid var(--line);
      display: flex; flex-direction: column; padding: 18px 14px 14px;
    }
    .brand { height: 56px; display: flex; align-items: center; gap: 11px; padding: 0 10px 12px; }
    .brand-mark {
      width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
      color: #fff; background: linear-gradient(145deg, #3775f1, #2454d4); box-shadow: 0 8px 18px rgba(40,100,232,.27);
    }
    .brand-mark svg { width: 22px; height: 22px; }
    .brand-name { font-size: 20px; font-weight: 800; letter-spacing: -.35px; }
    .brand-name small { display: block; color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: 1.1px; margin-top: 1px; }

    .nav-label { padding: 18px 12px 7px; color: #a0aabd; font-size: 10px; font-weight: 800; letter-spacing: 1.2px; }
    .nav { display: grid; gap: 4px; }
    .nav-btn {
      height: 43px; width: 100%; border: 0; border-radius: 11px; background: transparent; color: #66748a;
      display: flex; align-items: center; gap: 12px; padding: 0 13px; text-align: left; font-weight: 650; transition: .16s ease;
    }
    .nav-btn svg { width: 18px; height: 18px; stroke-width: 1.9; }
    .nav-btn:hover { background: #f5f7fb; color: #39475e; }
    .nav-btn.active { background: var(--brand-soft); color: var(--brand); font-weight: 750; }
    .nav-btn .badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; display: grid; place-items: center; font-size: 10px; color: #fff; background: var(--brand); }
    .sidebar-spacer { flex: 1; }
    .core-card { border: 1px solid var(--line); background: #fafbfd; border-radius: 13px; padding: 12px; margin: 12px 3px; }
    .core-row { display: flex; align-items: center; gap: 9px; font-weight: 750; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #cbd4e2; box-shadow: 0 0 0 4px rgba(203,212,226,.25); }
    .dot.on { background: var(--green); box-shadow: 0 0 0 4px rgba(24,165,102,.13); }
    .core-meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 8px; }
    .sidebar-foot { display: flex; align-items: center; justify-content: space-around; color: #97a4b6; padding: 5px 4px 0; }
    .icon-link { width: 31px; height: 31px; border: 0; background: transparent; color: inherit; border-radius: 8px; display: grid; place-items: center; }
    .icon-link:hover { background: #f2f5f9; color: var(--brand); }

    .main { grid-column: 2; min-width: 0; min-height: 100vh; padding-top: var(--topbar); padding-bottom: var(--statusbar); }
    .topbar {
      position: fixed; top: 0; left: var(--sidebar); right: 0; height: var(--topbar); z-index: 15;
      background: rgba(255,255,255,.94); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 20px; padding: 0 24px;
    }
    .page-identity { min-width: 120px; }
    .page-identity strong { font-size: 16px; font-weight: 800; }
    .page-identity small { display: block; color: var(--muted); font-size: 10px; margin-top: 3px; }
    .top-divider { width: 1px; height: 30px; background: var(--line); }
    .top-field { display: grid; gap: 4px; }
    .top-field label { color: var(--muted); font-size: 10px; font-weight: 700; }
    .top-select { width: 158px; height: 34px; border: 1px solid var(--line-strong); border-radius: 9px; padding: 0 32px 0 11px; color: var(--text); background: #fff; outline: none; }
    .seg { display: flex; background: #f0f3f8; padding: 3px; border-radius: 10px; gap: 2px; }
    .seg button { height: 29px; border: 0; padding: 0 15px; background: transparent; color: #66748a; border-radius: 8px; font-weight: 700; }
    .seg button.active { color: var(--brand); background: #fff; box-shadow: 0 2px 7px rgba(41,62,97,.09); }
    .top-spacer { flex: 1; }
    .top-metrics { display: flex; align-items: center; gap: 20px; }
    .metric-mini { min-width: 72px; }
    .metric-mini small { display: block; color: var(--muted); font-size: 9px; margin-bottom: 2px; }
    .metric-mini strong { font-size: 13px; font-variant-numeric: tabular-nums; }
    .metric-mini .down { color: var(--brand); }
    .metric-mini .up { color: var(--green); }
    .power-btn { height: 40px; min-width: 96px; padding: 0 17px; border: 0; border-radius: 11px; background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; font-weight: 800; box-shadow: 0 7px 17px rgba(40,100,232,.24); }
    .power-btn.running { background: #1d9a63; box-shadow: 0 7px 17px rgba(29,154,99,.2); }

    .workspace { padding: 22px 24px 26px; max-width: 1560px; margin: 0 auto; }
    .page-head { display: flex; align-items: end; justify-content: space-between; margin-bottom: 17px; }
    .page-head h1 { margin: 0; font-size: 22px; letter-spacing: -.45px; }
    .page-head p { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
    .head-actions { display: flex; gap: 9px; }
    .btn { height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line-strong); background: #fff; color: #4f5e74; font-weight: 700; display: inline-flex; align-items: center; gap: 7px; }
    .btn:hover { border-color: #b7c6dc; background: #fbfcfe; }
    .btn.primary { color: #fff; border-color: var(--brand); background: var(--brand); box-shadow: 0 5px 13px rgba(40,100,232,.18); }
    .btn.soft { color: var(--brand); border-color: transparent; background: var(--brand-soft); }
    .btn.danger { color: var(--red); background: #fff5f6; border-color: #ffe0e4; }
    .btn.sm { height: 30px; padding: 0 10px; font-size: 12px; border-radius: 8px; }

    .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
    .card-head { min-height: 55px; padding: 14px 17px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .card-title { font-size: 14px; font-weight: 800; }
    .card-sub { color: var(--muted); font-size: 11px; margin-top: 3px; }
    .card-body { padding: 17px; }
    .grid { display: grid; gap: 16px; }
    .grid.kpis { grid-template-columns: repeat(4, minmax(0,1fr)); margin-bottom: 16px; }
    .grid.main-grid { grid-template-columns: minmax(0,1.75fr) minmax(300px,.8fr); }
    .grid.two { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .grid.three { grid-template-columns: repeat(3, minmax(0,1fr)); }

    .kpi { padding: 15px 16px; display: flex; align-items: center; gap: 13px; min-height: 82px; }
    .kpi-icon { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); }
    .kpi-icon.green { background: var(--green-soft); color: var(--green); }
    .kpi-icon.orange { background: var(--orange-soft); color: var(--orange); }
    .kpi-label { color: var(--muted); font-size: 10px; font-weight: 700; }
    .kpi-value { margin-top: 3px; font-size: 20px; font-weight: 850; letter-spacing: -.3px; }
    .kpi-value small { color: var(--muted); font-size: 10px; font-weight: 650; margin-left: 3px; }

    .flow { padding: 20px 18px; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; gap: 20px; }
    .flow-step { position: relative; min-width: 0; text-align: center; }
    .flow-step:not(:last-child)::after { content: ""; position: absolute; top: 21px; right: -22px; width: 24px; height: 1px; background: #ccd6e5; }
    .flow-node { width: 44px; height: 44px; border-radius: 12px; margin: 0 auto 8px; display: grid; place-items: center; background: #f2f5f9; color: #75839a; border: 1px solid #e4e9f1; }
    .flow-step.active .flow-node { background: var(--brand-soft); color: var(--brand); border-color: #d9e5ff; }
    .flow-step.good .flow-node { background: var(--green-soft); color: var(--green); border-color: #d4f0e1; }
    .flow-step b { display: block; font-size: 12px; }
    .flow-step small { color: var(--muted); font-size: 9px; }
    .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .quick { border: 1px solid var(--line); border-radius: 11px; min-height: 76px; padding: 12px; background: #fff; text-align: left; }
    .quick:hover { border-color: #c9d7ed; transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    .quick b { display: block; margin-bottom: 4px; }
    .quick small { color: var(--muted); font-size: 10px; }

    .health-list { display: grid; gap: 11px; }
    .health-item { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
    .health-info b { font-size: 12px; }
    .health-info small { display: block; color: var(--muted); font-size: 9px; margin-top: 3px; }
    .health-bar { height: 5px; border-radius: 4px; background: #edf1f6; margin-top: 7px; overflow: hidden; }
    .health-bar i { display: block; height: 100%; border-radius: inherit; background: var(--green); }
    .latency { color: var(--green); font-size: 11px; font-weight: 800; }
    .status-pill { display: inline-flex; height: 23px; align-items: center; gap: 6px; padding: 0 8px; border-radius: 12px; color: var(--green); background: var(--green-soft); font-size: 10px; font-weight: 800; }
    .status-pill.warn { color: var(--orange); background: var(--orange-soft); }
    .status-pill.gray { color: #748197; background: #f0f3f7; }

    .split-layout { display: grid; grid-template-columns: minmax(310px,.72fr) minmax(0,1.65fr); gap: 16px; }
    .tabs { display: flex; padding: 4px; background: #f1f4f8; border-radius: 10px; gap: 3px; }
    .tabs button { flex: 1; height: 31px; border: 0; border-radius: 8px; color: #6c798f; background: transparent; font-weight: 700; font-size: 12px; }
    .tabs button.active { color: var(--brand); background: #fff; box-shadow: 0 2px 8px rgba(30,47,75,.08); }
    .field-label { display: block; color: #67748a; font-size: 11px; font-weight: 750; margin: 15px 0 7px; }
    .input, .textarea, .select { width: 100%; border: 1px solid var(--line-strong); background: #fff; color: var(--text); border-radius: 9px; outline: none; transition: .15s; }
    .input, .select { height: 37px; padding: 0 11px; }
    .textarea { min-height: 118px; resize: vertical; padding: 10px 11px; line-height: 1.6; }
    .input:focus, .textarea:focus, .select:focus { border-color: #8cacf5; box-shadow: 0 0 0 3px rgba(40,100,232,.09); }
    .hint { color: var(--muted); font-size: 10px; line-height: 1.55; }
    .form-actions { display: flex; gap: 8px; margin-top: 13px; }
    .searchbar { height: 37px; border: 1px solid var(--line-strong); border-radius: 9px; background: #fff; display: flex; align-items: center; gap: 8px; padding: 0 11px; min-width: 230px; }
    .searchbar input { border: 0; outline: 0; min-width: 0; width: 100%; background: transparent; }

    .table-wrap { overflow: hidden; }
    .table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .table th { height: 39px; background: #fafbfd; color: #8b97a9; text-align: left; font-size: 10px; font-weight: 800; padding: 0 13px; border-bottom: 1px solid var(--line); }
    .table td { height: 58px; padding: 0 13px; border-bottom: 1px solid #edf0f5; vertical-align: middle; }
    .table tr:last-child td { border-bottom: 0; }
    .table tr.selected { background: #f0fbf6; }
    .entity { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .entity-icon { width: 32px; height: 32px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 9px; background: var(--brand-soft); color: var(--brand); font-size: 10px; font-weight: 900; }
    .entity-icon.app { color: #fff; background: linear-gradient(145deg,#4c7ff1,#285ed9); }
    .entity-text { min-width: 0; }
    .entity-text b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
    .entity-text small { display: block; margin-top: 3px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 9px; }
    .tag { display: inline-flex; height: 22px; padding: 0 8px; align-items: center; border-radius: 6px; color: var(--brand); background: var(--brand-soft); font-size: 9px; font-weight: 850; }
    .row-actions { display: flex; justify-content: flex-end; gap: 5px; }
    .row-btn { width: 29px; height: 29px; border-radius: 8px; border: 1px solid transparent; color: #8390a3; background: transparent; }
    .row-btn:hover { color: var(--brand); background: var(--brand-soft); }
    .toggle { width: 35px; height: 20px; border-radius: 10px; position: relative; background: #cfd7e3; display: inline-block; }
    .toggle::after { content: ""; position: absolute; width: 16px; height: 16px; top: 2px; left: 2px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(20,35,60,.25); }
    .toggle.on { background: var(--brand); }
    .toggle.on::after { left: 17px; }

    .summary-strip { display: grid; grid-template-columns: repeat(4,1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 13px; overflow: hidden; margin-bottom: 16px; }
    .summary-cell { min-height: 66px; background: #fff; padding: 13px 15px; }
    .summary-cell span { display: block; color: var(--muted); font-size: 10px; }
    .summary-cell b { display: block; margin-top: 5px; font-size: 17px; }
    .summary-cell b.good { color: var(--green); }

    .rule-card { padding: 15px; display: flex; gap: 12px; align-items: center; }
    .rule-logo { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); font-weight: 900; }
    .rule-main { flex: 1; min-width: 0; }
    .rule-main b { display: block; }
    .rule-main small { color: var(--muted); font-size: 10px; }
    .rule-meta { text-align: right; }
    .rule-meta b { display: block; font-size: 13px; }
    .rule-meta small { color: var(--muted); font-size: 9px; }

    .sub-card { padding: 17px; }
    .sub-top { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
    .sub-icon { width: 39px; height: 39px; border-radius: 11px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); font-weight: 900; }
    .sub-card h3 { margin: 12px 0 4px; font-size: 14px; }
    .sub-card p { margin: 0; color: var(--muted); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sub-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 12px; border-top: 1px solid var(--line); }
    .sub-foot small { color: var(--muted); }

    .console { background: #111827; border-radius: 13px; overflow: hidden; color: #d5dbea; box-shadow: var(--shadow); }
    .console-head { height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #182234; border-bottom: 1px solid rgba(255,255,255,.07); }
    .console-dot { width: 9px; height: 9px; border-radius: 50%; }
    .console-dot.r { background:#ff6b6b; }.console-dot.y { background:#f8c74d; }.console-dot.g { background:#43d17a; }
    .console-title { color:#8996aa; font-size:10px; margin-left: 5px; }
    .console-body { padding: 14px 16px; height: 470px; overflow: auto; font: 11px/1.8 Consolas, monospace; }
    .log-time { color: #67758b; }.log-info { color:#69a2ff; }.log-ok { color:#52d394; }.log-warn { color:#f1b95f; }.log-msg { color:#c5ccda; }

    .setting-group { padding: 0; overflow: hidden; }
    .setting-row { min-height: 62px; padding: 11px 15px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--line); }
    .setting-row:last-child { border-bottom: 0; }
    .setting-info { flex: 1; }
    .setting-info b { font-size: 12px; }
    .setting-info small { display: block; color: var(--muted); font-size: 9px; margin-top: 3px; }
    .setting-control { min-width: 110px; text-align: right; }

    .statusbar {
      position: fixed; left: var(--sidebar); right: 0; bottom: 0; z-index: 15; height: var(--statusbar);
      background: rgba(255,255,255,.96); border-top: 1px solid var(--line); color: #77849a;
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 10px;
    }
    .status-left, .status-right { display: flex; align-items: center; gap: 15px; }
    .sep { width: 1px; height: 12px; background: var(--line-strong); }

    .empty { min-height: 230px; display: grid; place-items: center; text-align: center; color: var(--muted); }
    .empty b { color: var(--text-2); display: block; margin-bottom: 5px; }
    .proto-note { position: fixed; right: 16px; bottom: 49px; z-index: 30; color: #64748b; background: rgba(255,255,255,.93); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; font-size: 9px; box-shadow: var(--shadow-sm); }
    @media (max-width: 1280px) {
      :root { --sidebar: 198px; }
      .top-metrics .metric-mini:nth-child(2) { display:none; }
      .grid.kpis { grid-template-columns: repeat(2,1fr); }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="5" y="4" width="14" height="16" rx="7"/><path d="M12 4v16"/></svg></div>
        <div class="brand-name">ProxySplit<small>SMART ROUTING</small></div>
      </div>
      <div class="nav-label">工作台</div>
      <nav class="nav" id="nav">
        <button class="nav-btn active" data-page="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>概览</button>
        <button class="nav-btn" data-page="nodes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg>节点<span class="badge">3</span></button>
        <button class="nav-btn" data-page="apps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 5h4l3 7 3-7h4M5 19h4l3-7"/><circle cx="19" cy="5" r="1.5"/><circle cx="19" cy="19" r="1.5"/></svg>应用分流<span class="badge">4</span></button>
        <button class="nav-btn" data-page="rules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3l8 4v5c0 5-3.4 8-8 9-4.6-1-8-4-8-9V7l8-4z"/><path d="M9 12l2 2 4-4"/></svg>分流规则</button>
        <button class="nav-btn" data-page="subs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 5a14 14 0 0114 14M5 12a7 7 0 017 7"/><circle cx="6" cy="18" r="1.5" fill="currentColor"/></svg>订阅</button>
      </nav>
      <div class="nav-label">系统</div>
      <nav class="nav">
        <button class="nav-btn" data-page="logs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 6h14M5 10h14M5 14h9M5 18h9"/></svg>运行日志</button>
        <button class="nav-btn" data-page="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.6v.2h-4V21a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 00.3-1.9A1.7 1.7 0 003 14H2.8v-4H3a1.7 1.7 0 001.6-1 1.7 1.7 0 00-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 009 4.6 1.7 1.7 0 0010 3v-.2h4V3a1.7 1.7 0 001 1.6 1.7 1.7 0 001.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 00-.3 1.9 1.7 1.7 0 001.6 1h.2v4H21a1.7 1.7 0 00-1.6 1z"/></svg>设置</button>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="core-card">
        <div class="core-row"><span class="dot"></span><span>核心已停止</span></div>

            <div class="setting-row"><div class="setting-info"><b>界面主题</b><small>浅色、深色或跟随系统</small></div><div class="tabs" style="width:150px"><button class="active">亮</button><button>暗</button><button>跟随</button></div></div>
            <div class="setting-row"><div class="setting-info"><b>日志级别</b><small>建议日常使用 info</small></div><select class="select" style="width:96px"><option>info</option><option>debug</option></select></div>
            <div class="setting-row"><div class="setting-info"><b>核心版本</b><small>sing-box 1.13.14</small></div><button class="btn sm">检查更新</button></div>
            <div class="setting-row"><div class="setting-info"><b>恢复默认设置</b><small>保留节点和订阅</small></div><button class="btn danger sm">重置</button></div>
          </div></div>
        </div>`
    };

    const titles = { overview:'概览', nodes:'节点管理', apps:'应用分流', rules:'分流规则', subs:'订阅管理', logs:'运行日志', settings:'设置' };
    const workspace = document.getElementById('workspace');
    function activate(page) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.page === page));
      document.getElementById('topTitle').textContent = titles[page];
      workspace.innerHTML = pages[page]();
      workspace.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => activate(b.dataset.goto)));
      window.scrollTo(0,0);
    }
    document.querySelectorAll('.nav-btn').forEach(btn => btn.addEventListener('click', () => activate(btn.dataset.page)));
    document.querySelectorAll('#modeSeg button').forEach(btn => btn.addEventListener('click', () => { document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.remove('active')); btn.classList.add('active'); }));
    document.getElementById('powerBtn').addEventListener('click', function(){ this.classList.toggle('running'); this.innerHTML = this.classList.contains('running') ? '■&nbsp; 停止' : '⏻&nbsp; 启动'; document.querySelector('.dot').classList.toggle('on'); document.querySelector('.core-row span:last-child').textContent = this.classList.contains('running') ? '核心运行中' : '核心已停止'; });
    activate('overview');
  </script>
</body>
</html>
